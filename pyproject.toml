[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naman-NITA", email = "namank89123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.29.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
